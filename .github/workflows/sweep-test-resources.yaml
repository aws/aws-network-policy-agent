name: Sweep test resources

# Deletes test clusters and stacks left behind by earlier runs. Manual runs default to a dry run.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: List what would be deleted without deleting it
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: sweep-test-resources
  cancel-in-progress: false

env:
  REGION: us-west-2

jobs:
  sweep:
    if: github.repository == 'aws/aws-network-policy-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install eksctl
        run: |
          curl -fsSL "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin/

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.OSS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
          # Outlasts the job timeout.
          role-duration-seconds: 18000

      - name: Sweep
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
        run: ./scripts/eks-test-cluster.sh sweep
