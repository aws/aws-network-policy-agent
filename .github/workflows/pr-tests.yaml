name: Automatic Pull Request test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
      - "release*"

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest commit in the PR
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - uses: actions/cache@v3
        with:
          path: |
            ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-
      - name: Set up tools
        run: |
          go install golang.org/x/lint/golint@latest
          go install golang.org/x/tools/cmd/goimports@latest
      - name: Run code checks
        run: |
          make check-format
          make vet
      - name: Build
        run: make build-linux
      - name: Unit test
        run: make test
      - name: Kernel conntrack tests
        # These tests create a network namespace and conntrack flows, so they
        # need root and skip under make test. Build as the runner user and run
        # the binary with sudo, so no root-owned files land in the Go caches.
        # The binary is built with coverage, and its profile is uploaded with
        # make test's, since the conntrack GC is covered mostly by these tests.
        env:
          BPF_KERNEL_TESTS: required
        run: |
          sudo modprobe nf_conntrack
          go test -c -cover -covermode=atomic -o "$RUNNER_TEMP/conntrack.test" ./pkg/ebpf/conntrack/
          cd pkg/ebpf/conntrack
          sudo --preserve-env=BPF_KERNEL_TESTS "$RUNNER_TEMP/conntrack.test" -test.run 'Kernel$' -test.v -test.coverprofile="$RUNNER_TEMP/coverage-conntrack-kernel.txt"
      - name: BPF program kernel tests
        # These tests load the agent's compiled TC programs and run them on
        # test packets, so they need root and the BPF objects, which are
        # built in an AL2023 container like the image's. A skip counts as a
        # failure here, and so do missing conntrack kfuncs, which nf_conntrack
        # registers when it loads.
        env:
          BPF_KERNEL_TESTS: required
        run: |
          uname -r
          sudo modprobe nf_conntrack
          docker run --rm -v "$PWD":/src -w /src -e OWNER="$(id -u):$(id -g)" public.ecr.aws/amazonlinux/amazonlinux:2023 bash -c \
            'dnf install -y -q clang llvm make libbpf-devel bpftool && make vmlinuxh build-bpf && chown -R "$OWNER" pkg/ebpf/c'
          # The binary is built with coverage, and its profile is uploaded with
          # make test's, since only these tests reach the TC programs' config.
          go test -c -cover -covermode=atomic -o "$RUNNER_TEMP/ebpf.test" ./pkg/ebpf/
          cd pkg/ebpf
          sudo --preserve-env=BPF_KERNEL_TESTS "$RUNNER_TEMP/ebpf.test" -test.run 'Kernel$' -test.v -test.coverprofile="$RUNNER_TEMP/coverage-bpf-kernel.txt"
      - name: Upload code coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.txt,${{ runner.temp }}/coverage-conntrack-kernel.txt,${{ runner.temp }}/coverage-bpf-kernel.txt
          disable_search: true
          flags: unittest
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  docker-build:
    if: github.event_name == 'pull_request'
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest commit in the PR
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Network Policy Agent images
        run: make docker-buildx
  deprecated-apigroups:
    if: github.event_name == 'pull_request'
    name: Detect deprecated apiGroups
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: |
          version=$(curl -sL https://api.github.com/repos/FairwindsOps/pluto/releases/latest | jq -r ".tag_name")
          number=${version:1}
          wget https://github.com/FairwindsOps/pluto/releases/download/${version}/pluto_${number}_linux_amd64.tar.gz
          sudo tar -C /usr/local -xzf pluto_${number}_linux_amd64.tar.gz
      - run: |
          /usr/local/pluto detect-files -d .
  vuln_check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Go Version
        run: echo "GO_VERSION=$(cat .go-version)" >> $GITHUB_ENV
      - uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - uses: actions/cache@v3
        with:
          path: |
            ~/go/bin
          key: ${{ runner.os }}-govulncheck-${{ hashFiles('.go-version') }}
          restore-keys: |
            ${{ runner.os }}-govulncheck-
      - name: Install `govulncheck`
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run `govulncheck`
        run: ~/go/bin/govulncheck ./...
